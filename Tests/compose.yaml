name: propel-bundle-tests
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: bundle_test
      MYSQL_DATABASE: propel_bundle
    ports:
      - "33381:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pbundle_test" ]
      interval: 5s
      timeout: 5s
      retries: 40
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: bundle_test
      MARIADB_DATABASE: propel_bundle
    ports:
        - "33382:3306"
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 40
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: bundle_test
      POSTGRES_DB: propel_bundle
    ports:
        - "35453:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d propel_bundle" ]
      interval: 5s
      timeout: 5s
      retries: 40
