name: propel-bundle-tests
services:
  sqlsrv:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Bundle_test_2026!
    ports:
      - "127.0.0.1:${SQLSRV_TEST_PORT:-31433}:1433"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1'" ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: Bundle_test_2026!
      APP_USER: propel_bundle
      APP_USER_PASSWORD: bundle_test
    ports:
      - "127.0.0.1:${ORACLE_TEST_PORT:-31521}:1521"
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: Bundle_test_2026!
      MYSQL_DATABASE: propel_bundle
    ports:
      - "127.0.0.1:${MYSQL_TEST_PORT:-33381}:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\"" ]
      interval: 5s
      timeout: 5s
      retries: 40
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: Bundle_test_2026!
      MARIADB_DATABASE: propel_bundle
    ports:
      - "127.0.0.1:${MARIADB_TEST_PORT:-33382}:3306"
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 40
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: Bundle_test_2026!
      POSTGRES_DB: propel_bundle
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-35453}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d propel_bundle" ]
      interval: 5s
      timeout: 5s
      retries: 40
