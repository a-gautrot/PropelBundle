name: GitHub Actions - CI branch 6.1

on:
  push:
    branches:
      - '6.1'
  pull_request:
    branches:
      - '6.1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testsuite:
    name: "Test Suite (${{ matrix.platform.name }}, PHP ${{ matrix.php-version }})"
    runs-on: ${{ matrix.platform.runner }}
    defaults:
      run:
        shell: bash
    env:
      SYMFONY_REQUIRE: '6.4'
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        platform:
          - name: Linux arm64
            runner: ubuntu-26.04-arm
          - name: Linux x64
            runner: ubuntu-26.04
          - name: Windows arm64
            runner: windows-11-arm
          - name: Windows x64
            runner: windows-2025
          - name: macOS arm64
            runner: macos-26
        include:
          - php-version: '8.5'
            platform:
              name: macOS Intel
              runner: macos-26-intel

    steps:
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_sqlite
          coverage: pcov

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Composer get cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer update
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex
          composer u --prefer-dist -n

      - name: Run tests with PHP
        run: vendor/bin/phpunit --display-deprecations --display-notices --display-warnings --coverage-clover=Tests/coverage.xml --log-junit=Tests/junit.xml

      - name: Code Coverage Report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./Tests/
          files: ./Tests/coverage.xml
          fail_ci_if_error: true
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./Tests/junit.xml
          disable_search: true
          fail_ci_if_error: true
          verbose: true
