name: GitHub Actions - CI branch 7.1

on:
  push:
    branches:
      - '7.1'
  pull_request:
    branches:
      - '7.1'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SYMFONY_REQUIRE: '7.4.*'

jobs:
  sqlite:
    name: 'SQLite (${{ matrix.platform.name }}, PHP ${{ matrix.php-version }})'
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
          - '8.6'
        platform:
          - name: 'Linux arm64'
            runner: ubuntu-26.04-arm
          - name: 'Linux x64'
            runner: ubuntu-26.04
          - name: 'Windows arm64'
            runner: windows-11-arm
          - name: 'Windows x64'
            runner: windows-2025
          - name: 'macOS Apple Silicon'
            runner: macos-26
          - name: 'macOS Intel'
            runner: macos-26-intel
        include:
          - php-version: '8.2'
            platform:
              name: 'Linux x64'
              runner: ubuntu-26.04
            dependencies: lowest
    uses: ./.github/workflows/test-database.yml
    with:
      database: sqlite
      runner: '${{ matrix.platform.runner }}'
      php-version: '${{ matrix.php-version }}'
      dependencies: "${{ matrix.dependencies || 'highest' }}"
      extensions: pdo_sqlite
      docker-dsn: 'sqlite::memory:'
      native-dsn: 'sqlite::memory:'

  mysql:
    name: 'MySQL (${{ matrix.platform.name }}, PHP ${{ matrix.php-version }})'
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
          - '8.6'
        platform:
          - name: 'Linux x64'
            runner: ubuntu-26.04
          - name: 'Linux arm64'
            runner: ubuntu-26.04-arm
          - name: 'Windows x64'
            runner: windows-2025
          - name: 'macOS Apple Silicon'
            runner: macos-26
          - name: 'macOS Intel'
            runner: macos-26-intel
    uses: ./.github/workflows/test-database.yml
    with:
      database: mysql
      runner: '${{ matrix.platform.runner }}'
      php-version: '${{ matrix.php-version }}'
      extensions: 'pdo_mysql, pdo_sqlite'
      service: mysql
      docker-dsn: 'mysql:host=127.0.0.1;port=33381;dbname=propel_bundle'
      native-dsn: 'mysql:host=127.0.0.1;port=3306;dbname=propel_bundle'
      windows-dsn: 'mysql:host=127.0.0.1;port=3307;dbname=propel_bundle'
      docker-user: root
      native-user: ci
      password: Bundle_test_2026!

  mariadb:
    name: 'MariaDB (${{ matrix.platform.name }}, PHP ${{ matrix.php-version }})'
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
          - '8.6'
        platform:
          - name: 'Linux x64'
            runner: ubuntu-26.04
          - name: 'Linux arm64'
            runner: ubuntu-26.04-arm
          - name: 'Windows x64'
            runner: windows-2025
          - name: 'macOS Apple Silicon'
            runner: macos-26
          - name: 'macOS Intel'
            runner: macos-26-intel
    uses: ./.github/workflows/test-database.yml
    with:
      database: mariadb
      runner: '${{ matrix.platform.runner }}'
      php-version: '${{ matrix.php-version }}'
      extensions: 'pdo_mysql, pdo_sqlite'
      service: mariadb
      docker-dsn: 'mysql:host=127.0.0.1;port=33382;dbname=propel_bundle'
      native-dsn: 'mysql:host=127.0.0.1;port=3306;dbname=propel_bundle'
      docker-user: root
      native-user: ci
      password: Bundle_test_2026!

  postgres:
    name: 'PostgreSQL (${{ matrix.platform.name }}, PHP ${{ matrix.php-version }})'
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
          - '8.6'
        platform:
          - name: 'Linux x64'
            runner: ubuntu-26.04
          - name: 'Linux arm64'
            runner: ubuntu-26.04-arm
          - name: 'Windows x64'
            runner: windows-2025
          - name: 'macOS Apple Silicon'
            runner: macos-26
          - name: 'macOS Intel'
            runner: macos-26-intel
    uses: ./.github/workflows/test-database.yml
    with:
      database: postgres
      runner: '${{ matrix.platform.runner }}'
      php-version: '${{ matrix.php-version }}'
      extensions: 'pdo_pgsql, pdo_sqlite'
      service: postgres
      docker-dsn: 'pgsql:host=127.0.0.1;port=35453;dbname=propel_bundle'
      native-dsn: 'pgsql:host=127.0.0.1;port=5432;dbname=propel_bundle'
      docker-user: postgres
      native-user: ci
      password: Bundle_test_2026!

  sqlsrv:
    name: 'SQL Server (${{ matrix.platform.name }}, PHP ${{ matrix.php-version }})'
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
          - '8.6'
        platform:
          - name: 'Linux x64'
            runner: ubuntu-26.04
          - name: 'Windows x64'
            runner: windows-2025
          - name: 'macOS Intel'
            runner: macos-26-intel
    uses: ./.github/workflows/test-database.yml
    with:
      database: sqlsrv
      runner: '${{ matrix.platform.runner }}'
      php-version: '${{ matrix.php-version }}'
      extensions: 'pdo_sqlsrv, pdo_sqlite'
      service: sqlsrv
      docker-dsn: 'sqlsrv:Server=127.0.0.1,31433;Database=propel_bundle;TrustServerCertificate=1'
      native-dsn: 'sqlsrv:Server=(localdb)\PropelBundle;Database=propel_bundle;TrustServerCertificate=1'
      docker-user: sa
      password: Bundle_test_2026!

  mssql:
    name: 'MSSQL (${{ matrix.platform.name }}, PHP ${{ matrix.php-version }})'
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
          - '8.6'
        platform:
          - name: 'Linux x64'
            runner: ubuntu-26.04
          - name: 'macOS Intel'
            runner: macos-26-intel
    uses: ./.github/workflows/test-database.yml
    with:
      database: mssql
      runner: '${{ matrix.platform.runner }}'
      php-version: '${{ matrix.php-version }}'
      extensions: 'pdo_dblib, pdo_sqlite'
      service: sqlsrv
      docker-dsn: 'dblib:host=127.0.0.1:31433;dbname=propel_bundle;charset=UTF-8;version=7.4'
      docker-user: sa
      password: Bundle_test_2026!

  oracle:
    name: 'Oracle (${{ matrix.platform.name }}, PHP ${{ matrix.php-version }})'
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
          - '8.6'
        platform:
          - name: 'Linux x64'
            runner: ubuntu-26.04
          - name: 'Linux arm64'
            runner: ubuntu-26.04-arm
    uses: ./.github/workflows/test-database.yml
    with:
      database: oracle
      runner: '${{ matrix.platform.runner }}'
      php-version: '${{ matrix.php-version }}'
      extensions: 'pdo_oci, pdo_sqlite'
      service: oracle
      docker-dsn: 'oci:dbname=//127.0.0.1:31521/FREEPDB1;charset=AL32UTF8'
      docker-user: propel_bundle
      password: bundle_test

  coverage:
    name: Coverage, PHP 8.4
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: xdebug

      - name: Composer get cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-php-8.4-coverage-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-php-8.4-

      - name: Install dependencies with Symfony Flex
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex
          export COMPOSER_IGNORE_PLATFORM_REQ=php+
          composer u -n --prefer-dist --no-progress --prefer-stable

      - run: composer validate --strict
      - name: Check coverage extensions
        run: |
          php --ri xdebug
          php --ri pdo_sqlite
      - run: composer test:coverage -- --display-deprecations --display-phpunit-deprecations
        env:
          XDEBUG_MODE: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: Tests/coverage.xml
          disable_search: true
          flags: github
          name: github-php-8.4
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: Tests/junit.xml
          disable_search: true
          fail_ci_if_error: true
